# mini-forwarder 配置文件示例
# 用于在跳板机 (B) 上运行，将流量从 C 转发到 A

# 全局设置
log_level: "info"          # debug | info | warn | error
log_format: "json"         # json (生产环境) | console (开发调试)
hot_reload: true           # 配置文件变更后自动热加载
shutdown_timeout: "30s"    # 优雅退出等待时间

# 转发规则列表
forwards:
  - name: "app-service"
    listen: ":3000"               # 在 B 上监听的地址和端口
    target: "10.0.0.1:3000"      # A 的地址和端口
    dial_timeout: "10s"           # 连接目标超时
    idle_timeout: "300s"          # 空闲连接超时 (0 禁用)
    max_retries: 3                # 连接目标失败重试次数
    retry_interval: "1s"          # 重试间隔 (指数退避)
    keep_alive: "30s"             # TCP KeepAlive 间隔

  - name: "redis"
    listen: ":6379"
    target: "10.0.0.1:6379"
    dial_timeout: "5s"
    idle_timeout: "0"             # 禁用空闲超时 (长连接服务)
    max_retries: 5
    retry_interval: "500ms"
    keep_alive: "15s"

  - name: "mysql"
    listen: "127.0.0.1:3306"
    target: "10.0.0.1:3306"
    dial_timeout: "10s"
    idle_timeout: "600s"
    max_retries: 3
    keep_alive: "30s"
